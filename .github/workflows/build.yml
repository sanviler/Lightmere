
# Builds Lightmere on Windows, Linux and macOS at every push and pull request.
# On a version tag (v0.8.0, ...) the packages are attached to a GitHub release.

name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure (vcpkg, static SDL2)
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          cmake --preset windows-vcpkg

      - name: Build
        run: cmake --build --preset release

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if (-not $version.StartsWith("v")) {
            $version = ""
          }
          ./scripts/package.ps1 -BuildDir build/Release -OutDir dist -Version $version

      - uses: actions/upload-artifact@v4
        with:
          name: lightmere-windows-x64
          path: dist/*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Build
        run: |
          cmake --preset linux -DLM_LINUX_PORTABLE=ON
          cmake --build build -j

      - name: Package
        run: |
          mkdir -p dist/lightmere
          strip -o dist/lightmere/lightmere build/lightmere
          cp README.md LICENSE CHANGELOG.md dist/lightmere/
          cd dist && tar czf lightmere-${GITHUB_REF_NAME//\//-}-linux-x64.tar.gz lightmere

      - uses: actions/upload-artifact@v4
        with:
          name: lightmere-linux-x64
          path: dist/*.tar.gz

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: brew install sdl2

      - name: Build
        run: |
          cmake --preset linux
          cmake --build build -j

      - name: Package
        run: |
          mkdir -p dist/lightmere
          cp build/lightmere README.md LICENSE CHANGELOG.md dist/lightmere/
          cd dist && zip -r lightmere-${GITHUB_REF_NAME//\//-}-macos.zip lightmere

      - uses: actions/upload-artifact@v4
        with:
          name: lightmere-macos
          path: dist/*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
